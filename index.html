<!DOCTYPE html>
<html lang="el" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Γυμνάσιο Νέας Ερυθραίας - Φυσικές Επιστήμες | Διαδραστικά Κουίζ</title>
    <meta name="description" content="Εκπαιδευτική πύλη διαδραστικών κουίζ Φυσικών Επιστημών για τους μαθητές του Γυμνασίου Νέας Ερυθραίας (Τάξεις Α', Β', Γ' Γυμνασίου) στα μαθήματα Φυσικής, Χημείας, Βιολογίας και Γεωγραφίας.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- LaTeX Mathematical Typography Fonts: STIX Two & KaTeX -->
    <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    
    <!-- Application Stylesheet -->
    <link rel="stylesheet" href="css/styles.css?v=54">
    
    <!-- MathJax 3 Engine (Mathematical & Physics Formulas) -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        },
        startup: {
          typeset: false,
          ready: function() {
            MathJax.startup.defaultReady();
            const target = document.getElementById('theory-mount') || document.getElementById('tab-panel-theory');
            if (target && window.MathJax && window.MathJax.typesetPromise) {
              window.MathJax.typesetPromise([target]).catch(function(err) { console.warn('MathJax ready error:', err); });
            }
          }
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <!-- Dynamic Background Image Layer with Gradient Overlay -->
    <div class="bg-layer" id="dynamic-bg" style="background-image: url('assets/images/school_photo_bg.jpg');"></div>
    <div class="bg-overlay"></div>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="nav-container">
            <a class="brand-link" onclick="navigateTo('')" title="Αρχική Σελίδα">
                <div class="brand-logo-icon">🔬</div>
                <div>
                    <div class="brand-title">
                        Γυμνάσιο Νέας Ερυθραίας
                        <span class="brand-badge">Φυσικές Επιστήμες</span>
                    </div>
                </div>
            </a>

            <!-- Dynamic Breadcrumbs -->
            <nav class="nav-breadcrumbs" id="nav-breadcrumbs" aria-label="Πλοήγηση">
                <!-- Injected via JavaScript -->
            </nav>

            <!-- Theme Toggle -->
            <div class="nav-actions">
                <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" title="Εναλλαγή Θέματος (Dark / Light)">
                    <span id="theme-toggle-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main View Content Area -->
    <main class="main-wrapper" id="app-content">
        <!-- Views are rendered dynamically by app.js:
             1. Class Selection View
             2. Subject Selection View
             3. Quiz Selection View
             4. Interactive Quiz Runner View
        -->
    </main>

    <!-- Educational Footer -->
    <footer class="footer">
        <div class="footer-content" style="justify-content: center; text-align: center;">
            <div>
                © 2026 - 2027 Γυμνάσιο Νέας Ερυθραίας - Φυσικές Επιστήμες | Διαδραστικά Κουίζ
            </div>
        </div>
    </footer>

    <!-- Circuit Diagram Fullscreen Lightbox Modal -->
    <div id="diagram-lightbox" class="diagram-lightbox" onclick="closeDiagramLightbox(event)">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="lightbox-close-btn" onclick="closeDiagramLightbox()" title="Κλείσιμο (Esc)">✕</button>
            <div class="lightbox-title" id="lightbox-title">Διάγραμμα Κυκλώματος</div>
            <img id="lightbox-img" src="" alt="Διάγραμμα Κυκλώματος" />
        </div>
    </div>

    <!-- Floating Toast Notification (Global) -->
    <div class="toast-notification" id="toast-msg"></div>

    <!-- Application Scripts -->
    <script src="js/quiz-data.js?v=54"></script>
    <script src="js/simulation.js?v=54"></script>
    <script src="js/theory.js?v=54"></script>
    <script src="js/app.js?v=54"></script>
</body>
</html>
