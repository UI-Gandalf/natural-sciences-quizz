    <!-- MathJax 3 Engine (Mathematical & Physics Formulas) -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        },
        startup: {
          typeset: false
        }
      };

      // Robust serialized MathJax rendering queue preventing DOMException/IndexSizeError
      window.renderMath = (function() {
        let queue = Promise.resolve();
        return function(elements) {
          const list = Array.isArray(elements) ? elements : [elements || document.body];
          return new Promise(function(resolve) {
            function attempt() {
              if (window.MathJax && window.MathJax.typesetPromise) {
                queue = queue.then(function() {
                  const valid = list.filter(function(el) {
                    return el && (el === document.body || document.body.contains(el));
                  });
                  if (valid.length === 0) return Promise.resolve();
                  return window.MathJax.typesetPromise(valid);
                }).catch(function(err) {
                  console.warn('MathJax serialization warning:', err);
                }).finally(resolve);
              } else {
                setTimeout(attempt, 60);
              }
            }
            attempt();
          });
        };
      })();
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
