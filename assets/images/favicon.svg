<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Purple Orbit Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Emerald Orbit Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gold Core Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Radial Glow for Core -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Border -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Subtle Inner Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)" />

  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Orbit 1: Cyan (-30 deg) -->
    <g transform="rotate(-30)">
      <ellipse cx="0" cy="0" rx="180" ry="68" fill="none" stroke="url(#cyanGrad)" stroke-width="15" stroke-linecap="round" />
      <circle cx="180" cy="0" r="13" fill="#38bdf8" />
      <circle cx="-180" cy="0" r="8" fill="#e0f2fe" opacity="0.8" />
    </g>

    <!-- Orbit 2: Purple (+30 deg) -->
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="180" ry="68" fill="none" stroke="url(#purpleGrad)" stroke-width="15" stroke-linecap="round" />
      <circle cx="-180" cy="0" r="13" fill="#c084fc" />
      <circle cx="180" cy="0" r="8" fill="#f3e8ff" opacity="0.8" />
    </g>

    <!-- Orbit 3: Emerald (90 deg) -->
    <g transform="rotate(90)">
      <ellipse cx="0" cy="0" rx="180" ry="68" fill="none" stroke="url(#emeraldGrad)" stroke-width="15" stroke-linecap="round" />
      <circle cx="0" cy="68" r="13" fill="#34d399" />
    </g>

    <!-- Central Energy Nucleus Orb -->
    <circle cx="0" cy="0" r="46" fill="#0f172a" stroke="#fbbf24" stroke-width="6" />
    <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" opacity="0.25" />

    <!-- Electric Lightning / Energy Bolt Icon in Center -->
    <path d="M 6 -32 L -20 2 L 2 2 L -8 32 L 22 -4 L -2 -4 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>
